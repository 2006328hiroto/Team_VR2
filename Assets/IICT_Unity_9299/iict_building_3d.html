tb('壁透過',b=>{wOn=!wOn;WL.forEach(m=>{m.material.transparent=!wOn;m.material.opacity=wOn?1:.18;m.material.depthWrite=wOn;m.material.needsUpdate=true;});b.classList.toggle('off',wOn);}).classList.add('off');
tb('真上',()=>{ph=.05;});tb('斜め',()=>{ph=.9;});
// parts editor: tap a part -> edit position / size / rotation (origin 0,0,0 = elevator centre at ground, metres)
const PARTS=[],EDITS={},DEL=[];
(function(){const cnt={},t=(a,b)=>Math.abs(a-b)<.011;
 function cat(g){const p=g.parameters||{};
  if(g.type==='BoxGeometry'){const w=p.width,h=p.height,d=p.depth,th=Math.min(w,d);
   if(t(h,.4))return'Floor';if(t(h,.28))return'Ceiling';if(t(th,.15)&&h>.5)return'Wall';if(t(h,2)&&t(th,.05))return'DoorLeaf';if(t(h,.05))return'FenceBar';if(t(w,.06)&&t(h,1.1))return'FencePost';if(t(th,.1)&&h>.4)return'GlassOrRail';if(t(w,1.5)&&t(h,2.1))return'EVDoor';if(t(w,2.9)&&t(h,12.1))return'EVShaft';if(h<.3)return'Void';return'Block';}
  return g.type==='CylinderGeometry'?'Column':g.type==='ConeGeometry'?'Tree':'Vestibule';}
 function add(list,grp){list.forEach((m,i)=>{if(!m.isMesh||!m.geometry||m.geometry.type==='PlaneGeometry')return;
  const c=cat(m.geometry),k=grp+c;cnt[k]=(cnt[k]||0)+1;
  m.geometry.computeBoundingBox();const bb=m.geometry.boundingBox;
  PARTS.push({m,name:grp+'_'+c+'_'+String(cnt[k]).padStart(3,'0'),e:list[i+1]&&list[i+1].isLineSegments?list[i+1]:null,s0:[bb.max.x-bb.min.x,bb.max.y-bb.min.y,bb.max.z-bb.min.z],p0:m.position.clone(),r0:m.rotation.y});});}
 for(const k in groups)add(groups[k].grp.children,k);
 add(sc.children,'Misc');})();
const ed=document.createElement('div');ed.id='ed';ed.style.display='none';document.body.appendChild(ed);
ed.innerHTML='<b id="en"></b><div class="r"><span>位置 XYZ</span><input id="p0"><input id="p1"><input id="p2"></div><div class="r"><span>サイズ</span><input id="s0"><input id="s1"><input id="s2"></div><div class="r"><span>回転Y°</span><input id="ry"></div><div class="r"><button id="bd">削除</button><button id="bu">取消</button><button id="br">元に戻す</button><button id="bx">書出</button><button id="bc">×</button></div><div class="r"><button id="bm">移動(ドラッグ)</button><button id="bk">複製</button><button id="ba">箱を追加</button></div><textarea id="out" readonly></textarea>';
ed.querySelectorAll('input').forEach(i=>{i.type='number';i.step='0.05';i.inputMode='decimal';i.addEventListener('input',()=>sel&&apply());});
const $=id=>document.getElementById(id);
let sel=null,hl=null;
function sync(p){const m=p.m;if(p.e){p.e.position.copy(m.position);p.e.scale.copy(m.scale);p.e.rotation.copy(m.rotation);p.e.visible=m.visible;}if(hl)hl.update();}
function rec(p){const m=p.m;return{pos:[m.position.x,m.position.y,m.position.z].map(v=>+v.toFixed(3)),size:[0,1,2].map(i=>+(p.s0[i]*[m.scale.x,m.scale.y,m.scale.z][i]).toFixed(3)),rotY:+(m.rotation.y*180/Math.PI).toFixed(2),deleted:!m.visible};}
function save(){try{localStorage.setItem('iict_edits',JSON.stringify(EDITS));}catch(e){}}
function put(p,r){const m=p.m,q=(a,b)=>b>1e-6?a/b:1;m.position.set(r.pos[0],r.pos[1],r.pos[2]);m.scale.set(q(r.size[0],p.s0[0]),q(r.size[1],p.s0[1]),q(r.size[2],p.s0[2]));m.rotation.y=r.rotY*Math.PI/180;m.visible=!r.deleted;sync(p);}
function fill(){const m=sel.m;$('p0').value=m.position.x.toFixed(2);$('p1').value=m.position.y.toFixed(2);$('p2').value=m.position.z.toFixed(2);const r=rec(sel);[0,1,2].forEach(i=>$('s'+i).value=r.size[i].toFixed(2));$('ry').value=r.rotY.toFixed(1);}
function show(p){sel=p;moveOn=false;if($('bm'))$('bm').textContent='移動(ドラッグ)';if(hl){sc.remove(hl);hl=null;}$('out').style.display='none';if(!p){ed.style.display='none';return;}hl=new THREE.BoxHelper(p.m,0x00aaff);sc.add(hl);ed.style.display='block';$('en').textContent=p.name;fill();}
function apply(){const v=id=>parseFloat($(id).value),P=[v('p0'),v('p1'),v('p2')],Z=[v('s0'),v('s1'),v('s2')],r=rec(sel);
 if(P.every(isFinite))r.pos=P;if(Z.every(x=>isFinite(x)&&x>0))r.size=Z;if(isFinite(v('ry')))r.rotY=v('ry');
 put(sel,r);EDITS[sel.name]=rec(sel);save();}
$('bd').onclick=()=>{if(!sel)return;sel.m.visible=false;DEL.push(sel);sync(sel);EDITS[sel.name]=rec(sel);save();show(null);};
$('bu').onclick=()=>{const p=DEL.pop();if(!p)return;p.m.visible=true;sync(p);EDITS[p.name]=rec(p);save();show(p);};
$('br').onclick=()=>{if(!sel)return;const p=sel,m=p.m;m.position.copy(p.p0);m.scale.set(1,1,1);m.rotation.y=p.r0;m.visible=true;sync(p);delete EDITS[p.name];save();fill();};
$('bc').onclick=()=>show(null);
let NA=0;
function moved(){sync(sel);if(!sel.added){EDITS[sel.name]=rec(sel);save();}fill();}
$('bm').onclick=()=>{if(!sel)return;moveOn=!moveOn;$('bm').textContent=moveOn?'移動中(1本指でドラッグ)':'移動(ドラッグ)';};
$('bk').onclick=()=>{if(!sel)return;const o=sel,m=o.m.clone();m.material=o.m.material;m.position.x+=0.5;m.position.z+=0.5;o.m.parent.add(m);
 let e=null;if(o.e){e=o.e.clone();o.e.parent.add(e);}
 const p={m,name:'Copy_'+String(++NA).padStart(3,'0')+'_of_'+o.name,e,s0:o.s0.slice(),p0:m.position.clone(),r0:m.rotation.y,added:true};PARTS.push(p);show(p);moved();};
$('ba').onclick=()=>{const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshLambertMaterial({color:0xc8a06a}));m.position.set(tg.x,0.5,tg.z);sc.add(m);
 const p={m,name:'Added_'+String(++NA).padStart(3,'0'),e:null,s0:[1,1,1],p0:m.position.clone(),r0:0,added:true};PARTS.push(p);show(p);};
$('bx').onclick=()=>{const t=JSON.stringify({edits:EDITS,added:PARTS.filter(p=>p.added&&p.m.visible).map(p=>Object.assign({name:p.name},rec(p)))},null,1),o=$('out');o.style.display='block';o.value=t;o.focus();o.select();try{navigator.clipboard.writeText(t);}catch(e){}};
try{const s=JSON.parse(localStorage.getItem('iict_edits')||'{}');for(const n in s){const p=PARTS.find(q=>q.name===n);if(p){put(p,s[n]);EDITS[n]=s[n];}}}catch(e){}
const rc=new THREE.Raycaster(),dp=[0,0];let multi=false,lastG=null,moveOn=false;
function gpt(e,y0){const r=cv.getBoundingClientRect();rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);const o=rc.ray.origin,d2=rc.ray.direction;if(Math.abs(d2.y)<1e-4)return null;const t=(y0-o.y)/d2.y;return t>0?{x:o.x+d2.x*t,z:o.z+d2.z*t}:null;}
cv.addEventListener('pointerdown',e=>{dp[0]=e.clientX;dp[1]=e.clientY;if(pts.size>=1)multi=true;lastG=sel?gpt(e,sel.m.position.y):null;});
cv.addEventListener('pointerup',e=>{const ok=!multi&&Math.hypot(e.clientX-dp[0],e.clientY-dp[1])<6;if(pts.size<=1)multi=false;if(!ok)return;
 const r=cv.getBoundingClientRect();rc.setFromCamera({x:(e.clientX-r.left)/r.width*2-1,y:-(e.clientY-r.top)/r.height*2+1},cam);
 const objs=PARTS.filter(p=>p.m.visible&&p.m.parent&&p.m.parent.visible!==false).map(p=>p.m);
 const h=rc.intersectObjects(objs,false)[0];show(h?PARTS.find(p=>p.m===h.object):null);});
// orbit
let th=.8,ph=.9,d=90;const tg=new THREE.Vector3(0,5,13);
function upd(){cam.position.set(tg.x+d*Math.sin(ph)*Math.sin(th),tg.y+d*Math.cos(ph),tg.z+d*Math.sin(ph)*Math.cos(th));cam.lookAt(tg);}
const pts=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,[e.clientX,e.clientY]);});
cv.addEventListener('pointerup',e=>pts.delete(e.pointerId));
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const o=pts.get(e.pointerId);
 if(pts.size===1){if(moveOn&&sel){const q=gpt(e,sel.m.position.y);if(q&&lastG){sel.m.position.x+=q.x-lastG.x;sel.m.position.z+=q.z-lastG.z;moved();}lastG=q;}else{th-=(e.clientX-o[0])*.008;ph=Math.min(1.5,Math.max(.1,ph-(e.clientY-o[1])*.008));}}
 pts.set(e.pointerId,[e.clientX,e.clientY]);
 if(pts.size===2){const a=[...pts.values()],n=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd)d=Math.min(200,Math.max(3,d*pd/n));pd=n;
  const mx=(a[0][0]+a[1][0])/2,my=(a[0][1]+a[1][1])/2;if(pm){const k=d*0.0016,dx=mx-pm[0],dy=my-pm[1];tg.x+=-Math.cos(th)*dx*k-Math.sin(th)*dy*k;tg.z+=Math.sin(th)*dx*k-Math.cos(th)*dy*k;}pm=[mx,my];}else{pd=0;pm=null;}});
cv.addEventListener('wheel',e=>{e.preventDefault();d=Math.min(200,Math.max(3,d*(1+e.deltaY*.001)));},{passive:false});
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
 R.setClearColor(matchMedia('(prefers-color-scheme:dark)').matches?0x1c2127:0xcfe3f2);}
addEventListener('resize',rs);rs();
(function a(){requestAnimationFrame(a);upd();R.render(sc,cam);})();
</script></body></html>
